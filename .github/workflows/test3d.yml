name: 3B test (Rapier + WebGL ekran görüntüleri)
on:
  push:
    branches: [simulator]
  workflow_dispatch: {}
jobs:
  test3d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run libs
      - run: |
          set -o pipefail
          mkdir -p sonuc
          node test/fizik3d.mjs 2>&1 | tail -80
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: (cd www && python3 -m http.server 8080 &) && sleep 2 && node test/ekran.mjs
      - name: Sonuçları test-sonuclari dalına koy
        run: |
          cp -r sonuc /tmp/sonuc && cd /tmp/sonuc && ls -la
          git init -q && git checkout -q -b test-sonuclari
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -qm "Test ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" test-sonuclari
