name: Derle (APK + Windows EXE)
on:
  push:
    branches: [simulator, main, master]
  workflow_dispatch: {}

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: npm install
      - run: npm run libs
      - run: echo "sdk.dir=$ANDROID_HOME" && ls $ANDROID_HOME/platforms | tail -3
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MEB-Robot-Sim-APK
          path: android/app/build/outputs/apk/debug/*.apk
      - name: APK'yı apk-dosyalari dalına koy
        run: |
          mkdir -p /tmp/apk && cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/apk/MEB-Robot-Sim.apk
          cd /tmp/apk && git init -q && git checkout -q -b apk-dosyalari
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add MEB-Robot-Sim.apk && git commit -qm "APK derleme ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk-dosyalari

  exe:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run libs
      - run: npx electron-builder --win portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: MEB-Robot-Sim-Windows
          path: dist/*.exe
